name: TWA Java CI

# Workflow reutilizable para servicios y librerías Java de TWA. Lee el .twa-standards.yml del repo (tipo, versión de
# Java y severidad de cada control) y corre los controles que le tocan. Cada control falla el check solo si su
# severidad es block (docs/politica-de-severidades.md). Uso y migración: docs/uso.md.
#
# Jobs: config → style (BLD-01) | build (BLD-02, BLD-03, BLD-04, ARC-01, ARC-02, TST-01, TST-02, SEC-02 SpotBugs,
# API-01, API-02, API-03) |
# security (SEC-01, SEC-02 Semgrep, SEC-03, SEC-04, SEC-05) | image (DKR-01, DKR-02, DKR-03, DKR-04) |
# repository (WFL-01, DEP-01, GOV-01, GOV-02)
# → twa-standards. El último resume a los demás (una tabla con todos los controles y el artifact twa-results): es el
# check que se exige en la protección de la rama.
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directorio del pom raíz, relativo a la raíz del repo
        type: string
        default: '.'
      config-file:
        description: Configuración de los controles, relativa a working-directory
        type: string
        default: .twa-standards.yml
      maven-args:
        description: Argumentos extra para Maven (ej. -pl search-service -am)
        type: string
        default: ''
      artifact-name:
        description: Si no está vacío, sube el jar con este nombre de artifact
        type: string
        default: ''
      artifact-path:
        description: Glob del jar a subir, relativo a working-directory (ej. search-service/target/*-exec.jar)
        type: string
        default: ''
      docker-context:
        description: Contexto de la imagen, relativo a working-directory
        type: string
        default: '.'
      dockerfile:
        description: Dockerfile, relativo a working-directory
        type: string
        default: Dockerfile
      standards-ref:
        description: Versión de twa-engineering-standards de la que salen los scripts y el catálogo. No cambiarla
        type: string
        default: v0.1.2 # x-release-please-version
    secrets:
      PACKAGES_TOKEN:
        description: Token clásico con read:packages para las librerías TWA de GitHub Packages
        required: false

permissions: {}

env:
  # Versiones fijadas de los plugins que se agregan por línea de comandos (el pom del repo no los declara)
  # renovate: datasource=maven depName=org.jacoco:jacoco-maven-plugin
  JACOCO_VERSION: 0.8.16
  # renovate: datasource=maven depName=org.apache.maven.plugins:maven-enforcer-plugin
  ENFORCER_VERSION: 3.7.0
  # renovate: datasource=maven depName=org.apache.maven.plugins:maven-dependency-plugin
  DEPENDENCY_VERSION: 3.11.0
  # renovate: datasource=maven depName=com.github.spotbugs:spotbugs-maven-plugin
  SPOTBUGS_VERSION: 4.10.5.0
  # renovate: datasource=maven depName=com.h3xstream.findsecbugs:findsecbugs-plugin
  FINDSECBUGS_VERSION: 1.14.0
  # renovate: datasource=maven depName=org.cyclonedx:cyclonedx-maven-plugin
  CYCLONEDX_VERSION: 2.9.3

jobs:
  config:
    name: Config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      type: ${{ steps.config.outputs.type }}
      architecture: ${{ steps.config.outputs.architecture }}
      java: ${{ steps.config.outputs.java }}
      severities: ${{ steps.config.outputs.severities }}
      params: ${{ steps.config.outputs.params }}
      standards-sha: ${{ steps.standards.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andres-sacco/twa-engineering-standards
          ref: ${{ inputs.standards-ref }}
          path: .twa-standards
          persist-credentials: false
      # standards-ref (un tag) se resuelve acá a un commit, una sola vez: los demás jobs hacen checkout de ese commit,
      # así todos corren los mismos scripts aunque el tag se mueva durante la corrida, y queda en twa-results. Que el
      # tag no se pueda mover lo garantiza la protección de los tags vX.Y.Z (docs/versionado.md)
      # Fuera del workspace: que no entre en el build ni en el contexto de Docker
      - id: standards
        name: Standards
        run: |
          echo "sha=$(git -C .twa-standards rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          mv .twa-standards "$RUNNER_TEMP/twa-standards"
          echo "STANDARDS_DIR=$RUNNER_TEMP/twa-standards" >>"$GITHUB_ENV"
      - id: config
        name: Read .twa-standards.yml
        working-directory: ${{ inputs.working-directory }}
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
        run: '"$STANDARDS_DIR/scripts/read-config.sh" "$CONFIG_FILE"'

  style:
    name: Code style
    needs: config
    if: fromJSON(needs.config.outputs.severities)['BLD-01'] != 'off'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andres-sacco/twa-engineering-standards
          ref: ${{ needs.config.outputs.standards-sha }}
          path: .twa-standards
          persist-credentials: false
      - name: Standards
        working-directory: ${{ github.workspace }}
        run: |
          mv .twa-standards "$RUNNER_TEMP/twa-standards"
          {
            echo "STANDARDS_DIR=$RUNNER_TEMP/twa-standards"
            echo "TWA_RESULTS_FILE=$RUNNER_TEMP/twa-results/style.jsonl"
            echo "TWA_JOB=style"
          } >>"$GITHUB_ENV"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java }}
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory }}/**/pom.xml
      - name: Maven settings
        env:
          PACKAGES_USER: ${{ github.repository_owner }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: mkdir -p ~/.m2 && "$STANDARDS_DIR/scripts/maven-settings.sh" >~/.m2/settings.xml
      - name: BLD-01 Spotless
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['BLD-01'] }}
        run: >-
          "$STANDARDS_DIR/scripts/run-control.sh" BLD-01 "$SEVERITY"
          "El código no cumple el formato: corré mvn spotless:apply"
          -- mvn -B -ntp spotless:check
      # El resultado de cada control de este job, para el resumen del job twa-standards
      - name: Upload results
        if: ${{ !cancelled() }}
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twa-results-style
          path: ${{ runner.temp }}/twa-results
          if-no-files-found: ignore
          retention-days: 1

  build:
    name: Build and test
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      MAVEN_ARGS: ${{ inputs.maven-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andres-sacco/twa-engineering-standards
          ref: ${{ needs.config.outputs.standards-sha }}
          path: .twa-standards
          persist-credentials: false
      - name: Standards
        working-directory: ${{ github.workspace }}
        run: |
          mv .twa-standards "$RUNNER_TEMP/twa-standards"
          {
            echo "STANDARDS_DIR=$RUNNER_TEMP/twa-standards"
            echo "TWA_RESULTS_FILE=$RUNNER_TEMP/twa-results/build.jsonl"
            echo "TWA_JOB=build"
          } >>"$GITHUB_ENV"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java }}
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory }}/**/pom.xml
      - name: Maven settings
        env:
          PACKAGES_USER: ${{ github.repository_owner }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: mkdir -p ~/.m2 && "$STANDARDS_DIR/scripts/maven-settings.sh" >~/.m2/settings.xml

      - name: BLD-03 Java and Maven versions
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['BLD-03'] }}
          JAVA: ${{ needs.config.outputs.java }}
        run: '"$STANDARDS_DIR/scripts/check-build-versions.sh" "$SEVERITY" "$JAVA"'

      # Lee el pom efectivo: no compila
      - name: ARC-02 Architecture rules version
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['ARC-02'] }}
          ARCHITECTURE: ${{ needs.config.outputs.architecture }}
          PARAMS: ${{ needs.config.outputs.params }}
        run: |
          # shellcheck disable=SC2086 # MAVEN_ARGS son varios argumentos
          "$STANDARDS_DIR/scripts/check-architecture-version.sh" "$SEVERITY" "$ARCHITECTURE" "$PARAMS" $MAVEN_ARGS

      - name: BLD-04 Dependency convergence
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['BLD-04'] }}
        run: |
          # shellcheck disable=SC2086 # MAVEN_ARGS son varios argumentos
          "$STANDARDS_DIR/scripts/run-control.sh" BLD-04 "$SEVERITY" \
            "Hay dependencias que no convergen o versiones duplicadas en un pom: ver el log de este step" \
            -- mvn -B -ntp "org.apache.maven.plugins:maven-enforcer-plugin:${ENFORCER_VERSION}:enforce" \
            -Denforcer.rules=dependencyConvergence,banDuplicatePomDependencyVersions $MAVEN_ARGS

      # Tests unitarios (Surefire) y de integración (Failsafe), con JaCoCo agregado por línea de comandos. Spotless ya
      # corrió en el job style
      - id: verify
        name: BLD-02 Build and test
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['BLD-02'] }}
          COVERAGE: ${{ fromJSON(needs.config.outputs.severities)['TST-01'] != 'off' || fromJSON(needs.config.outputs.severities)['TST-02'] != 'off' }}
        run: |
          goals=(verify)
          if [[ "$COVERAGE" == "true" ]]; then
            goals=("org.jacoco:jacoco-maven-plugin:${JACOCO_VERSION}:prepare-agent" verify
              "org.jacoco:jacoco-maven-plugin:${JACOCO_VERSION}:report")
          fi
          # shellcheck disable=SC2086 # MAVEN_ARGS son varios argumentos
          "$STANDARDS_DIR/scripts/run-control.sh" BLD-02 "$SEVERITY" \
            "Falló la compilación o algún test: ver el log de este step y el artifact test-reports" \
            -- mvn -B -ntp "${goals[@]}" -Dspotless.check.skip=true $MAVEN_ARGS
      # Las reglas de ArchUnit corren dentro de verify (perfil architecture-rules de cada repo): acá se leen sus
      # resultados en los reportes de Surefire
      - name: ARC-01 Architecture rules
        if: ${{ !cancelled() && (steps.verify.outputs.result == 'ok' || steps.verify.outputs.result == 'fail') }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['ARC-01'] }}
          VERIFY_RESULT: ${{ steps.verify.outputs.result }}
        run: '"$STANDARDS_DIR/scripts/check-architecture.sh" "$SEVERITY" "$VERIFY_RESULT"'
      - name: Upload test reports
        if: steps.verify.outputs.result == 'fail'
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            ${{ inputs.working-directory }}/**/target/surefire-reports
            ${{ inputs.working-directory }}/**/target/failsafe-reports
            ${{ inputs.working-directory }}/**/target/karate-reports
          retention-days: 3
      - name: Test annotations
        if: ${{ !cancelled() && (steps.verify.outputs.result == 'ok' || steps.verify.outputs.result == 'fail') }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: |
            ${{ inputs.working-directory }}/**/target/surefire-reports/TEST-*.xml
            ${{ inputs.working-directory }}/**/target/failsafe-reports/TEST-*.xml
          annotate_only: true
          detailed_summary: true
          include_passed: false

      # TST-02 compara contra la cobertura del último push a la rama principal, que queda en la cache de Actions
      - name: Restore coverage baseline
        if: steps.verify.outputs.result == 'ok' && fromJSON(needs.config.outputs.severities)['TST-02'] != 'off'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coverage-baseline.json
          key: twa-coverage-${{ inputs.working-directory }}-${{ github.event.repository.default_branch }}-${{ github.sha }}
          restore-keys: twa-coverage-${{ inputs.working-directory }}-${{ github.event.repository.default_branch }}-
      - name: TST-01 TST-02 Coverage
        if: steps.verify.outputs.result == 'ok'
        env:
          SEVERITY_MIN: ${{ fromJSON(needs.config.outputs.severities)['TST-01'] }}
          SEVERITY_DROP: ${{ fromJSON(needs.config.outputs.severities)['TST-02'] }}
          PARAMS: ${{ needs.config.outputs.params }}
        run: >-
          "$STANDARDS_DIR/scripts/coverage.sh" "$SEVERITY_MIN" "$SEVERITY_DROP" "$PARAMS"
          "$RUNNER_TEMP/coverage-baseline.json" "$RUNNER_TEMP/coverage.json"
      - name: Prepare coverage baseline
        if: >-
          steps.verify.outputs.result == 'ok' && github.event_name == 'push'
          && github.ref_name == github.event.repository.default_branch
        run: cp "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/coverage-baseline.json"
      - name: Save coverage baseline
        if: >-
          steps.verify.outputs.result == 'ok' && github.event_name == 'push'
          && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/coverage-baseline.json
          key: twa-coverage-${{ inputs.working-directory }}-${{ github.event.repository.default_branch }}-${{ github.sha }}
      - name: Upload coverage report
        if: steps.verify.outputs.result == 'ok'
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: ${{ inputs.working-directory }}/**/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload jar
        if: steps.verify.outputs.result == 'ok' && inputs.artifact-name != ''
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 1

      # SpotBugs analiza el bytecode: corre acá, sobre lo que ya compiló verify. Semgrep (la otra mitad de SEC-02) corre
      # en el job security. Va al final para que un hallazgo en block no saltee los pasos de cobertura
      - name: SEC-02 SpotBugs + FindSecBugs
        if: steps.verify.outputs.result == 'ok' && fromJSON(needs.config.outputs.severities)['SEC-02'] != 'off'
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['SEC-02'] }}
          REPORTS_DIR: ${{ runner.temp }}/spotbugs-reports
        run: |
          # shellcheck disable=SC2086 # MAVEN_ARGS son varios argumentos
          "$STANDARDS_DIR/scripts/check-spotbugs.sh" "$SEVERITY" $MAVEN_ARGS
      - name: Upload SpotBugs reports
        if: ${{ !cancelled() && steps.verify.outputs.result == 'ok' && fromJSON(needs.config.outputs.severities)['SEC-02'] != 'off' }}
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports-spotbugs
          path: ${{ runner.temp }}/spotbugs-reports
          if-no-files-found: ignore
          retention-days: 3

      # La spec la exporta el OpenApiIT de cada servicio dentro de verify (target/openapi.json). API-02 y API-03 la
      # leen de ahí; API-03 compara contra la del último push a la rama principal, que queda en la cache de Actions
      - id: openapi
        name: API-01 OpenAPI spec
        if: >-
          ${{ !cancelled() && steps.verify.outputs.result == 'ok' && (
          fromJSON(needs.config.outputs.severities)['API-01'] != 'off'
          || fromJSON(needs.config.outputs.severities)['API-02'] != 'off'
          || fromJSON(needs.config.outputs.severities)['API-03'] != 'off') }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['API-01'] }}
          REPORTS_DIR: ${{ runner.temp }}/openapi-reports
        run: '"$STANDARDS_DIR/scripts/openapi-export.sh" "$SEVERITY"'
      - name: API-02 Spectral
        if: ${{ !cancelled() && steps.openapi.outputs.result == 'ok' && fromJSON(needs.config.outputs.severities)['API-02'] != 'off' }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['API-02'] }}
          PARAMS: ${{ needs.config.outputs.params }}
          REPORTS_DIR: ${{ runner.temp }}/openapi-reports
        run: '"$STANDARDS_DIR/scripts/check-openapi-lint.sh" "$SEVERITY" "$PARAMS"'
      - name: Restore OpenAPI baseline
        if: ${{ !cancelled() && steps.openapi.outputs.result == 'ok' && fromJSON(needs.config.outputs.severities)['API-03'] != 'off' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openapi-baseline
          key: twa-openapi-${{ inputs.working-directory }}-${{ github.event.repository.default_branch }}-${{ github.sha }}
          restore-keys: twa-openapi-${{ inputs.working-directory }}-${{ github.event.repository.default_branch }}-
      - name: API-03 Breaking changes
        if: ${{ !cancelled() && steps.openapi.outputs.result == 'ok' && fromJSON(needs.config.outputs.severities)['API-03'] != 'off' }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['API-03'] }}
          REPORTS_DIR: ${{ runner.temp }}/openapi-reports
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking-change') }}
        run: '"$STANDARDS_DIR/scripts/check-openapi-breaking.sh" "$SEVERITY" "$RUNNER_TEMP/openapi-baseline" "$APPROVED"'
      - name: Prepare OpenAPI baseline
        if: >-
          ${{ !cancelled() && steps.openapi.outputs.result == 'ok' && github.event_name == 'push'
          && github.ref_name == github.event.repository.default_branch }}
        run: mkdir -p "$RUNNER_TEMP/openapi-baseline" && cp "$RUNNER_TEMP"/openapi-reports/specs/*.json "$RUNNER_TEMP/openapi-baseline/"
      - name: Save OpenAPI baseline
        if: >-
          ${{ !cancelled() && steps.openapi.outputs.result == 'ok' && github.event_name == 'push'
          && github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openapi-baseline
          key: twa-openapi-${{ inputs.working-directory }}-${{ github.event.repository.default_branch }}-${{ github.sha }}
      - name: Upload OpenAPI reports
        if: ${{ !cancelled() && steps.openapi.outputs.result == 'ok' }}
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: ${{ runner.temp }}/openapi-reports
          if-no-files-found: ignore
          retention-days: 3
      # El resultado de cada control de este job, para el resumen del job twa-standards
      - name: Upload results
        if: ${{ !cancelled() }}
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twa-results-build
          path: ${{ runner.temp }}/twa-results
          if-no-files-found: ignore
          retention-days: 1

  security:
    name: Security
    needs: config
    if: >-
      fromJSON(needs.config.outputs.severities)['SEC-01'] != 'off'
      || fromJSON(needs.config.outputs.severities)['SEC-02'] != 'off'
      || fromJSON(needs.config.outputs.severities)['SEC-03'] != 'off'
      || fromJSON(needs.config.outputs.severities)['SEC-04'] != 'off'
      || fromJSON(needs.config.outputs.severities)['SEC-05'] != 'off'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      MAVEN_ARGS: ${{ inputs.maven-args }}
      # SEC-03 y SEC-05 leen el SBOM: se genera aunque SEC-04 esté en off
      NEEDS_SBOM: >-
        ${{ fromJSON(needs.config.outputs.severities)['SEC-03'] != 'off'
        || fromJSON(needs.config.outputs.severities)['SEC-04'] != 'off'
        || fromJSON(needs.config.outputs.severities)['SEC-05'] != 'off' }}
    steps:
      # Todo el historial: SEC-01 recorre los commits del PR o del push
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andres-sacco/twa-engineering-standards
          ref: ${{ needs.config.outputs.standards-sha }}
          path: .twa-standards
          persist-credentials: false
      - name: Standards
        working-directory: ${{ github.workspace }}
        run: |
          mv .twa-standards "$RUNNER_TEMP/twa-standards"
          {
            echo "STANDARDS_DIR=$RUNNER_TEMP/twa-standards"
            echo "TWA_RESULTS_FILE=$RUNNER_TEMP/twa-results/security.jsonl"
            echo "TWA_JOB=security"
            echo "REPORTS_DIR=$RUNNER_TEMP/security-reports"
          } >>"$GITHUB_ENV"

      # En la raíz del repo, no en working-directory: un secreto en cualquier carpeta cuenta
      - name: SEC-01 Gitleaks
        if: fromJSON(needs.config.outputs.severities)['SEC-01'] != 'off'
        working-directory: ${{ github.workspace }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['SEC-01'] }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          source "$STANDARDS_DIR/scripts/lib.sh"
          "$STANDARDS_DIR/scripts/check-secrets.sh" "$SEVERITY" "$(event_range)"

      - name: SEC-02 Semgrep
        if: ${{ !cancelled() && fromJSON(needs.config.outputs.severities)['SEC-02'] != 'off' }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['SEC-02'] }}
          PARAMS: ${{ needs.config.outputs.params }}
        run: '"$STANDARDS_DIR/scripts/check-sast.sh" "$SEVERITY" "$PARAMS"'

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: ${{ !cancelled() && env.NEEDS_SBOM == 'true' }}
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java }}
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory }}/**/pom.xml
      - name: Maven settings
        if: ${{ !cancelled() && env.NEEDS_SBOM == 'true' }}
        env:
          PACKAGES_USER: ${{ github.repository_owner }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: mkdir -p ~/.m2 && "$STANDARDS_DIR/scripts/maven-settings.sh" >~/.m2/settings.xml
      - id: sbom
        name: SEC-04 SBOM
        if: ${{ !cancelled() && env.NEEDS_SBOM == 'true' }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['SEC-04'] }}
        run: |
          # shellcheck disable=SC2086 # MAVEN_ARGS son varios argumentos
          "$STANDARDS_DIR/scripts/sbom.sh" "$SEVERITY" $MAVEN_ARGS
      - name: SEC-03 Vulnerabilities
        if: ${{ !cancelled() && steps.sbom.outputs.result == 'ok' && fromJSON(needs.config.outputs.severities)['SEC-03'] != 'off' }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['SEC-03'] }}
          PARAMS: ${{ needs.config.outputs.params }}
        run: '"$STANDARDS_DIR/scripts/check-vulnerabilities.sh" "$SEVERITY" "$PARAMS"'
      - name: SEC-05 Licenses
        if: ${{ !cancelled() && steps.sbom.outputs.result == 'ok' && fromJSON(needs.config.outputs.severities)['SEC-05'] != 'off' }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['SEC-05'] }}
          PARAMS: ${{ needs.config.outputs.params }}
        run: '"$STANDARDS_DIR/scripts/check-licenses.sh" "$SEVERITY" "$PARAMS"'

      # SARIF y JSON de cada herramienta (Gitleaks con los secretos ocultos). El SBOM va aparte y dura más: es lo que se
      # consulta cuando sale una vulnerabilidad nueva
      - name: Upload security reports
        if: ${{ !cancelled() }}
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: |
            ${{ runner.temp }}/security-reports
            !${{ runner.temp }}/security-reports/bom.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload SBOM
        if: ${{ !cancelled() && steps.sbom.outputs.result == 'ok' && fromJSON(needs.config.outputs.severities)['SEC-04'] != 'off' }}
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/security-reports/bom.json
          if-no-files-found: error
          retention-days: 30
      # El resultado de cada control de este job, para el resumen del job twa-standards
      - name: Upload results
        if: ${{ !cancelled() }}
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twa-results-security
          path: ${{ runner.temp }}/twa-results
          if-no-files-found: ignore
          retention-days: 1

  image:
    name: Docker image
    needs: config
    if: >-
      fromJSON(needs.config.outputs.severities)['DKR-01'] != 'off'
      || fromJSON(needs.config.outputs.severities)['DKR-02'] != 'off'
      || fromJSON(needs.config.outputs.severities)['DKR-03'] != 'off'
      || fromJSON(needs.config.outputs.severities)['DKR-04'] != 'off'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      DOCKERFILE: ${{ inputs.dockerfile }}
      # DKR-03 y DKR-04 escanean la imagen construida: se carga en el Docker del runner con este nombre
      IMAGE: twa-ci/image:${{ github.sha }}
      NEEDS_IMAGE: >-
        ${{ fromJSON(needs.config.outputs.severities)['DKR-01'] != 'off'
        || fromJSON(needs.config.outputs.severities)['DKR-03'] != 'off'
        || fromJSON(needs.config.outputs.severities)['DKR-04'] != 'off' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andres-sacco/twa-engineering-standards
          ref: ${{ needs.config.outputs.standards-sha }}
          path: .twa-standards
          persist-credentials: false
      - name: Standards
        working-directory: ${{ github.workspace }}
        run: |
          mv .twa-standards "$RUNNER_TEMP/twa-standards"
          {
            echo "STANDARDS_DIR=$RUNNER_TEMP/twa-standards"
            echo "TWA_RESULTS_FILE=$RUNNER_TEMP/twa-results/image.jsonl"
            echo "TWA_JOB=image"
            echo "REPORTS_DIR=$RUNNER_TEMP/docker-reports"
          } >>"$GITHUB_ENV"

      # Sobre el Dockerfile: no hace falta construir
      - name: DKR-02 Hadolint
        if: fromJSON(needs.config.outputs.severities)['DKR-02'] != 'off'
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['DKR-02'] }}
        run: '"$STANDARDS_DIR/scripts/check-dockerfile.sh" "$SEVERITY" "$DOCKERFILE"'

      # El settings.xml entra al build como secret: no queda en ninguna capa de la imagen
      - name: Maven settings
        if: ${{ !cancelled() && env.NEEDS_IMAGE == 'true' }}
        env:
          PACKAGES_USER: ${{ github.repository_owner }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: '"$STANDARDS_DIR/scripts/maven-settings.sh" >"$RUNNER_TEMP/settings.xml"'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ !cancelled() && env.NEEDS_IMAGE == 'true' }}
      # Se construye y se carga en el Docker del runner para escanearla; no se publica
      - id: build
        name: DKR-01 Build image
        if: ${{ !cancelled() && env.NEEDS_IMAGE == 'true' }}
        continue-on-error: ${{ fromJSON(needs.config.outputs.severities)['DKR-01'] != 'block' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.working-directory }}/${{ inputs.docker-context }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          secret-files: maven-settings=${{ runner.temp }}/settings.xml
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: DKR-01 Report
        if: ${{ !cancelled() && env.NEEDS_IMAGE == 'true' && fromJSON(needs.config.outputs.severities)['DKR-01'] != 'off' }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['DKR-01'] }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          source "$STANDARDS_DIR/scripts/lib.sh"
          if [[ "$OUTCOME" == "success" ]]; then
            report DKR-01 "$SEVERITY" ok ""
          else
            report DKR-01 "$SEVERITY" fail "La imagen no construye: ver el log del step anterior"
          fi

      # Un escaneo de la imagen: vulnerabilidades del sistema operativo (DKR-03) y secretos en las capas (los lee DKR-04)
      - name: DKR-03 Image vulnerabilities
        if: >-
          ${{ !cancelled() && steps.build.outcome == 'success' && (
          fromJSON(needs.config.outputs.severities)['DKR-03'] != 'off'
          || fromJSON(needs.config.outputs.severities)['DKR-04'] != 'off') }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['DKR-03'] }}
          PARAMS: ${{ needs.config.outputs.params }}
        run: '"$STANDARDS_DIR/scripts/check-image.sh" "$SEVERITY" "$PARAMS" "$IMAGE"'
      - name: DKR-04 TWA policies
        if: ${{ !cancelled() && fromJSON(needs.config.outputs.severities)['DKR-04'] != 'off' }}
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['DKR-04'] }}
          PARAMS: ${{ needs.config.outputs.params }}
        run: '"$STANDARDS_DIR/scripts/check-docker-policies.sh" "$SEVERITY" "$PARAMS" "$DOCKERFILE"'
      - name: Upload Docker reports
        if: ${{ !cancelled() }}
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-reports
          path: ${{ runner.temp }}/docker-reports
          if-no-files-found: ignore
          retention-days: 3
      # El resultado de cada control de este job, para el resumen del job twa-standards
      - name: Upload results
        if: ${{ !cancelled() }}
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twa-results-image
          path: ${{ runner.temp }}/twa-results
          if-no-files-found: ignore
          retention-days: 1

  repository:
    name: Repository
    needs: config
    if: >-
      fromJSON(needs.config.outputs.severities)['WFL-01'] != 'off'
      || fromJSON(needs.config.outputs.severities)['DEP-01'] != 'off'
      || fromJSON(needs.config.outputs.severities)['GOV-01'] != 'off'
      || fromJSON(needs.config.outputs.severities)['GOV-02'] != 'off'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Todo el historial: GOV-01 compara los commits del PR o del push
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andres-sacco/twa-engineering-standards
          ref: ${{ needs.config.outputs.standards-sha }}
          path: .twa-standards
          persist-credentials: false
      - name: Standards
        run: |
          mv .twa-standards "$RUNNER_TEMP/twa-standards"
          {
            echo "STANDARDS_DIR=$RUNNER_TEMP/twa-standards"
            echo "TWA_RESULTS_FILE=$RUNNER_TEMP/twa-results/repository.jsonl"
            echo "TWA_JOB=repository"
          } >>"$GITHUB_ENV"
      - name: WFL-01 zizmor
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['WFL-01'] }}
        run: '"$STANDARDS_DIR/scripts/check-workflows.sh" "$SEVERITY"'
      - name: DEP-01 Renovate
        env:
          SEVERITY: ${{ fromJSON(needs.config.outputs.severities)['DEP-01'] }}
        run: '"$STANDARDS_DIR/scripts/check-renovate.sh" "$SEVERITY"'
      # Las supresiones y las severidades bajadas: qué agregan los commits nuevos (GOV-01) y que tengan su razón (GOV-02)
      - name: GOV-01 GOV-02 Exceptions
        if: >-
          ${{ !cancelled() && (fromJSON(needs.config.outputs.severities)['GOV-01'] != 'off'
          || fromJSON(needs.config.outputs.severities)['GOV-02'] != 'off') }}
        env:
          SEVERITY_CHANGES: ${{ fromJSON(needs.config.outputs.severities)['GOV-01'] }}
          SEVERITY_FORMAT: ${{ fromJSON(needs.config.outputs.severities)['GOV-02'] }}
          CONFIG_FILE: ${{ inputs.working-directory }}/${{ inputs.config-file }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          source "$STANDARDS_DIR/scripts/lib.sh"
          "$STANDARDS_DIR/scripts/check-suppressions.sh" "$SEVERITY_CHANGES" "$SEVERITY_FORMAT" "$(event_range)" "$CONFIG_FILE"
      # El resultado de cada control de este job, para el resumen del job twa-standards
      - name: Upload results
        if: ${{ !cancelled() }}
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twa-results-repository
          path: ${{ runner.temp }}/twa-results
          if-no-files-found: ignore
          retention-days: 1

  twa-standards:
    name: twa-standards
    needs: [config, style, build, security, image, repository]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andres-sacco/twa-engineering-standards
          ref: ${{ needs.config.outputs.standards-sha }}
          path: .twa-standards
          persist-credentials: false
      - name: Standards
        run: |
          mv .twa-standards "$RUNNER_TEMP/twa-standards"
          echo "STANDARDS_DIR=$RUNNER_TEMP/twa-standards" >>"$GITHUB_ENV"
      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: twa-results-*
          path: ${{ runner.temp }}/twa-results
          merge-multiple: true
      # Una tabla con todos los controles y twa-results.json, que lee el tablero (docs/reportes.md)
      - name: Summary
        if: needs.config.result == 'success'
        env:
          SEVERITIES: ${{ needs.config.outputs.severities }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          STANDARDS_REF: ${{ inputs.standards-ref }}
          STANDARDS_SHA: ${{ needs.config.outputs.standards-sha }}
        run: '"$STANDARDS_DIR/scripts/summary.sh" "$RUNNER_TEMP/twa-results" "$SEVERITIES" "$RUNNER_TEMP/twa-results.json"'
      - name: Upload twa-results
        if: needs.config.result == 'success'
        continue-on-error: true # sin artifact el job sigue: la cuota de la cuenta no bloquea un PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twa-results
          path: ${{ runner.temp }}/twa-results.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<<"$RESULTS")"
          if [[ -n "$failed" ]]; then
            echo "::error::Fallaron: $(tr '\n' ' ' <<<"$failed")(los controles en block; ver el resumen de este job)"
            exit 1
          fi
          echo "Todos los controles en block pasaron. Los avisos (warn) están en el resumen de este job."
