name: Release

# release-please mantiene un PR de release con el CHANGELOG a partir de los commits (Conventional Commits). Al
# mergearlo crea el tag vX.Y.Z y el release. Solo hay tags vX.Y.Z, fijos (protegidos por un ruleset): los repos
# consumidores fijan java-ci.yml por el SHA de uno de ellos (ver docs/versionado.md).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # crea el tag vX.Y.Z, el release y la rama del PR de release
      pull-requests: write # abre y actualiza el PR de release
    steps:
      # Con RELEASE_PLEASE_TOKEN y no con el GITHUB_TOKEN: el PR de release cambia .github/workflows/java-ci.yml (el
      # default de standards-ref) y el GITHUB_TOKEN no puede tocar workflows ("Error adding to tree"). Además, un PR
      # abierto con el GITHUB_TOKEN no dispara el CI. Ver docs/versionado.md
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
