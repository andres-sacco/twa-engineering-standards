name: CI

# CI de este repo: valida los workflows, el schema y el catálogo de controles (make lint), y corre java-ci.yml sobre el
# servicio de prueba. Las actions van fijadas por SHA, con la versión en el comentario (WFL-01).
on:
  push:
    branches: [main]
  pull_request:

# En un PR, un push nuevo cancela la corrida anterior; en main no, para que cada push guarde sus líneas de base
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint (Docker), zizmor y check-jsonschema (pipx), y los chequeos de consistencia de scripts/lint.sh. Con
      # GH_TOKEN, zizmor corre también las auditorías que consultan GitHub
      - name: make lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint

  # El workflow reutilizable, con el código de este commit, sobre el servicio de prueba: es la prueba de punta a punta
  # de java-ci.yml y de los scripts que corre
  sample-service:
    name: Sample service
    permissions:
      contents: read
    # ./ y no $/ (self-repository): actionlint 1.7.12 todavía no reconoce $/. Cambiar cuando lo soporte
    uses: ./.github/workflows/java-ci.yml # zizmor: ignore[self-repository]
    with:
      working-directory: examples/sample-service
      standards-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact-name: sample-service
      artifact-path: target/sample-service-*.jar
    # El sample usa twa-layered-rules, que está en GitHub Packages
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
