# Catálogo de controles: fuente de verdad de los ids, la severidad por defecto y la etapa en que se implementan.
# La tabla de docs/politica-de-severidades.md y el JSON Schema de .twa-standards.yml se verifican contra este archivo
# (make lint). Un id no se reusa: un control eliminado queda con `removed: true`.
#
# severity: la severidad por defecto (off | warn | block). appliesTo: los tipos de repo donde corre (service, library).
# stage: la etapa del plan (docs/plan.md) que lo implementa. Los controles de una etapa que no está en implementedStages
# se pueden configurar pero todavía no corren. params: los parámetros por defecto; los del .twa-standards.yml del repo
# se combinan encima.
implementedStages: [1, 2, 3, 4, 5, 7]
controls:
  BLD-01:
    name: Formato del código
    tool: Spotless
    severity: block
    stage: 2
    appliesTo: [service, library]
  BLD-02:
    name: Compila y pasan los tests unitarios y de integración
    tool: Maven, Surefire, Failsafe
    severity: block
    stage: 2
    appliesTo: [service, library]
  BLD-03:
    name: Versiones de Java y Maven exigidas
    tool: maven-enforcer-plugin
    severity: warn
    stage: 2
    appliesTo: [service, library]
  BLD-04:
    name: Convergencia de dependencias y dependencias prohibidas
    tool: maven-enforcer-plugin
    severity: warn
    stage: 2
    appliesTo: [service, library]
  TST-01:
    name: Cobertura de líneas mínima
    tool: JaCoCo
    severity: warn
    stage: 2
    appliesTo: [service, library]
    params:
      minLineCoverage: 60 # provisorio: se ajusta con lo que midan los repos en warn
  TST-02:
    name: La cobertura no baja respecto de main
    tool: JaCoCo
    severity: warn
    stage: 2
    appliesTo: [service, library]
    params:
      maxDrop: 0.5 # puntos de cobertura que puede bajar un PR respecto de la rama principal
  ARC-01:
    name: Corren y pasan las reglas de arquitectura de twa-layered-rules / twa-hexagonal-rules
    tool: ArchUnit (librería existente)
    severity: block
    stage: 3
    appliesTo: [service]
  ARC-02:
    name: Versión mínima de la librería de reglas
    tool: Maven (pom efectivo)
    severity: warn
    stage: 3
    appliesTo: [service]
    params:
      # La versión mínima de cada librería de reglas. Se sube cuando una versión nueva de la librería vuelve obligatoria
      # una regla (una major de la librería, ver su docs/architecture-rules.md § 8)
      minVersions:
        twa-layered-rules: 0.1.0
        twa-hexagonal-rules: 0.1.0
  SEC-01:
    name: Secretos en el código y en el historial del PR
    tool: Gitleaks
    severity: block
    stage: 4
    appliesTo: [service, library]
  SEC-02:
    name: Análisis estático de seguridad
    tool: Semgrep CE, SpotBugs + FindSecBugs
    severity: warn
    stage: 4
    appliesTo: [service, library]
    params:
      # Reglas de Semgrep (registry o archivos del repo). Se excluyen los tests (src/test)
      semgrepConfigs: [p/java]
  SEC-03:
    name: Vulnerabilidades CRITICAL/HIGH con versión corregida en dependencias
    tool: Trivy (sobre el SBOM)
    severity: warn
    stage: 4
    appliesTo: [service, library]
    params:
      severities: [CRITICAL, HIGH]
  SEC-04:
    name: SBOM generado y publicado como artifact
    tool: CycloneDX Maven plugin
    severity: warn
    stage: 4
    appliesTo: [service, library]
  SEC-05:
    name: Licencias de dependencias fuera de la lista permitida
    tool: SBOM (CycloneDX) contra la lista permitida
    severity: warn
    stage: 4
    appliesTo: [service, library]
    params:
      # Ids SPDX permitidos. Una dependencia con varias licencias (doble licencia) pasa si al menos una está acá
      allowedLicenses:
        - Apache-2.0
        - MIT
        - MIT-0
        - BSD-2-Clause
        - BSD-3-Clause
        - 0BSD
        - ISC
        - EPL-1.0
        - EPL-2.0
        - EDL-1.0
        - MPL-2.0
        - CDDL-1.0
        - CDDL-1.1
        - UPL-1.0
        - BSL-1.0
        - Zlib
        - CC0-1.0
        - Unlicense
        - GPL-2.0-with-classpath-exception
        - Classpath-exception-2.0
      # Lo que agrega un repo sin repetir la lista: más ids SPDX y dependencias puntuales (group:artifact), con la razón
      # en un comentario de su .twa-standards.yml
      extraAllowedLicenses: []
      allowedComponents: []
      # Grupos propios: no se les exige licencia
      ownGroups: [com.twa]
  API-01:
    name: La spec OpenAPI se exporta en el build
    tool: springdoc + OpenApiIT (target/openapi.json)
    severity: warn
    stage: 5
    appliesTo: [service]
  API-02:
    name: La spec cumple las convenciones de la plataforma
    tool: Spectral
    severity: warn
    stage: 5
    appliesTo: [service]
    params:
      # Reglas de config/spectral/twa.yaml que el repo apaga (con la razón en un comentario de su .twa-standards.yml)
      disabledRules: []
  API-03:
    name: Sin cambios incompatibles contra main sin aprobación explícita
    tool: oasdiff
    severity: warn
    stage: 5
    appliesTo: [service]
  DKR-01:
    name: La imagen construye
    tool: Docker Buildx
    severity: block
    stage: 2
    appliesTo: [service]
  DKR-02:
    name: Buenas prácticas del Dockerfile
    tool: Hadolint
    severity: warn
    stage: 6
    appliesTo: [service]
  DKR-03:
    name: Vulnerabilidades CRITICAL/HIGH con fix en la imagen
    tool: Trivy (image)
    severity: warn
    stage: 6
    appliesTo: [service]
  DKR-04:
    name: Políticas TWA de la imagen
    tool: Conftest (OPA), Dockle
    severity: warn
    stage: 6
    appliesTo: [service]
  DEP-01:
    name: El repo usa el preset de Renovate y no Dependabot
    tool: Renovate
    severity: warn
    stage: 7
    appliesTo: [service, library]
  WFL-01:
    name: Actions fijadas por SHA y permissions mínimos
    tool: zizmor
    severity: warn
    stage: 2
    appliesTo: [service, library]
